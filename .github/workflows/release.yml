name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git branch -r --contains "$GITHUB_REF" | grep -qE '(^|/)main$'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF is not reachable from main. Skipping release." >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.artifact }})
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `make build` compiles natively and runs the full test suite.
          - artifact: otp-x86_64_linux
            runner: ubuntu-latest
            make_target: build
            setup: ''
          # `make musl` produces the static Linux binary (also runs the tests).
          - artifact: otp-x86_64_linux_musl
            runner: ubuntu-latest
            make_target: musl
            setup: musl
          # Native arm64 runner: `make build` compiles natively and runs
          # the full test suite on arm64 Linux.
          - artifact: otp-aarch64_linux
            runner: ubuntu-24.04-arm
            make_target: build
            setup: ''
          # `make test-arm32` / `make test-riscv64` cross-compile static
          # binaries (32-bit ARM hard-float for Raspberry Pi OS and
          # similar; riscv64) and then run the full test suite against
          # them under qemu user-mode emulation - the same targets work
          # locally on any machine with the cross toolchain and qemu-user
          # installed.
          - artifact: otp-armv7l_linux
            runner: ubuntu-latest
            make_target: test-arm32
            setup: arm32
            qemu: qemu-arm
          - artifact: otp-riscv64_linux
            runner: ubuntu-latest
            make_target: test-riscv64
            setup: riscv64
            qemu: qemu-riscv64
          - artifact: otp-aarch64_macos
            runner: macos-14
            make_target: build
            setup: ''
          - artifact: otp-x86_64_macos-intel
            runner: macos-15-intel
            make_target: build
            setup: ''
          # `make mingw` cross-compiles bin/otp.exe with MinGW-w64. The test
          # suite cannot run here (the binary is a Windows executable), but
          # the same sources are fully tested by the Linux and macOS jobs.
          - artifact: otp-x86_64_windows
            runner: ubuntu-latest
            make_target: mingw
            setup: mingw
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: matrix.setup == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install MinGW-w64 toolchain
        if: matrix.setup == 'mingw'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install ARM cross toolchain and qemu
        if: matrix.setup == 'arm32'
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user-static

      - name: Install RISC-V cross toolchain and qemu
        if: matrix.setup == 'riscv64'
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user-static

      - name: Build and test
        run: make ${{ matrix.make_target }}

      # `make build`/`make musl` (and native-arm64 `build`) already run the
      # full suite through test/report.sh as their own "Testing..." step, so
      # test-report.html exists by the time this runs - only the qemu targets
      # need it generated here. test-arm32/test-riscv64 run their (curated)
      # subset through a raw loop in the Makefile rather than report.sh, so
      # nothing has produced a report for them yet; bin/otp is temporarily
      # replaced by the same qemu wrapper the Makefile's test-arm32/
      # test-riscv64 targets use so report.sh can execute it. Re-running
      # report.sh for the other targets here would just execute the entire
      # suite a second time for no new coverage. mingw is the one target
      # with no report at all: its binary is a Windows executable the
      # runner cannot execute. always() so a build that fails its tests
      # still gets a report generated (and, in the next step, uploaded)
      # instead of leaving this run with no visibility into what failed.
      - name: Generate HTML test report
        if: always() && matrix.qemu != ''
        run: |
          QEMU=$(command -v ${{ matrix.qemu }} || command -v ${{ matrix.qemu }}-static)
          mv bin/otp bin/otp.target
          printf '#!/bin/sh\nexec %s "$(dirname "$0")/otp.target" "$@"\n' "$QEMU" > bin/otp
          chmod +x bin/otp
          sh test/report.sh
          mv bin/otp.target bin/otp

      # always() (rather than the default success-only) so this uploads
      # even when the build above failed - a failing platform's report,
      # showing exactly which cases went red, is the one you most need.
      - name: Upload test report
        if: always() && matrix.make_target != 'mingw'
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.artifact }}
          path: test-report.html

      - name: Archive artifact (unix)
        if: matrix.make_target != 'mingw'
        run: |
          chmod +x bin/otp
          cp otp.1 test-report.html bin/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C bin otp otp.1 test-report.html

      - name: Archive artifact (windows)
        if: matrix.make_target == 'mingw'
        run: zip -j "${{ matrix.artifact }}.zip" bin/otp.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  # GitHub provides no BSD runners, so the three jobs below each boot the
  # matching vmactions VM on the Ubuntu runner and build and test inside
  # it. The sources need no changes on any BSD (the code's only platform
  # split is Windows vs POSIX); only the invocation differs: gmake because
  # the Makefile is GNU-make syntax and base `make` is BSD make, CC=cc to
  # use each system's native compiler (clang on FreeBSD/OpenBSD, gcc on
  # NetBSD), and bash from packages because the Makefile runs the test
  # scripts through it. Each action copies the working directory back to
  # the host after `run`, so bin/otp is archived and uploaded exactly like
  # the matrix artifacts. These are separate jobs rather than a matrix
  # because `uses:` cannot be parameterized by a matrix expression.
  build-freebsd:
    name: Build (otp-x86_64_freebsd)
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y gmake bash
          # `build` runs test/report.sh itself and leaves test-report.html
          # behind whether it passes or fails, so nothing further is needed
          # here to get one.
          run: gmake CC=cc build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-otp-x86_64_freebsd
          path: test-report.html

      - name: Archive artifact
        run: |
          chmod +x bin/otp
          cp otp.1 test-report.html bin/
          tar -czf otp-x86_64_freebsd.tar.gz -C bin otp otp.1 test-report.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: otp-x86_64_freebsd
          path: otp-x86_64_freebsd.tar.gz

  build-openbsd:
    name: Build (otp-x86_64_openbsd)
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.7"
          usesh: true
          prepare: pkg_add gmake bash
          # `build` runs test/report.sh itself and leaves test-report.html
          # behind whether it passes or fails, so nothing further is needed
          # here to get one.
          run: gmake CC=cc build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-otp-x86_64_openbsd
          path: test-report.html

      - name: Archive artifact
        run: |
          chmod +x bin/otp
          cp otp.1 test-report.html bin/
          tar -czf otp-x86_64_openbsd.tar.gz -C bin otp otp.1 test-report.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: otp-x86_64_openbsd
          path: otp-x86_64_openbsd.tar.gz

  build-netbsd:
    name: Build (otp-x86_64_netbsd)
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          usesh: true
          prepare: /usr/sbin/pkg_add gmake bash
          # `build` runs test/report.sh itself and leaves test-report.html
          # behind whether it passes or fails, so nothing further is needed
          # here to get one.
          run: gmake CC=cc build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-otp-x86_64_netbsd
          path: test-report.html

      - name: Archive artifact
        run: |
          chmod +x bin/otp
          cp otp.1 test-report.html bin/
          tar -czf otp-x86_64_netbsd.tar.gz -C bin otp otp.1 test-report.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: otp-x86_64_netbsd
          path: otp-x86_64_netbsd.tar.gz

  release:
    name: Create release & upload assets
    # No `if:` - the default gating is exactly what a release wants: every
    # build job must have succeeded (all targets built AND passed their
    # tests), and a skipped build (tag not on main) skips the release too.
    # The previous `if: always() && guard succeeded` published a release
    # even when build jobs failed - with the broken targets silently
    # missing from the assets - and created an empty release for tags not
    # on main.
    needs: [guard, build, build-freebsd, build-openbsd, build-netbsd]
    runs-on: ubuntu-latest
    steps:
      # Only the otp-* build artifacts become release assets. The
      # test-report-* artifacts stay as workflow-run files: they all
      # contain a file named test-report.html, so merging them here would
      # collide, and each platform's report is already inside its tarball.
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: otp-*
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: assets/*
