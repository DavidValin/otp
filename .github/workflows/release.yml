name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git branch -r --contains "$GITHUB_REF" | grep -qE '(^|/)main$'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF is not reachable from main. Skipping release." >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.artifact }})
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `make build` compiles natively and runs the full test suite.
          - artifact: otp-x86_64_linux
            runner: ubuntu-latest
            make_target: build
            setup: ''
          # `make musl` produces the static Linux binary (also runs the tests).
          - artifact: otp-x86_64_linux_musl
            runner: ubuntu-latest
            make_target: musl
            setup: musl
          - artifact: otp-aarch64_macos
            runner: macos-14
            make_target: build
            setup: ''
          - artifact: otp-x86_64_macos-intel
            runner: macos-15-intel
            make_target: build
            setup: ''
          # `make mingw` cross-compiles bin/otp.exe with MinGW-w64. The test
          # suite cannot run here (the binary is a Windows executable), but
          # the same sources are fully tested by the Linux and macOS jobs.
          - artifact: otp-x86_64_windows
            runner: ubuntu-latest
            make_target: mingw
            setup: mingw
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: matrix.setup == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install MinGW-w64 toolchain
        if: matrix.setup == 'mingw'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build and test
        run: make ${{ matrix.make_target }}

      - name: Archive artifact (unix)
        if: matrix.make_target != 'mingw'
        run: |
          chmod +x bin/otp
          tar -czf "${{ matrix.artifact }}.tar.gz" -C bin otp

      - name: Archive artifact (windows)
        if: matrix.make_target == 'mingw'
        run: zip -j "${{ matrix.artifact }}.zip" bin/otp.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    name: Create release & upload assets
    needs: [guard, build]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: assets/*
